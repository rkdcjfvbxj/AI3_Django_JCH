{% extends 'todos/base.html' %}
{% block content %}
<p class="eyebrow">MAKE IT HAPPEN</p><h1>{{ heading }}</h1>
<form method="post" class="panel" novalidate>{% csrf_token %}
{{ form.non_field_errors }}
{% for field in form %}
<div class="field {% if field.errors %}invalid{% endif %}">
<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="required">(필수)</span>{% endif %}</label>
{{ field }}
{% if field.errors %}<div class="errors" role="alert">{{ field.errors }}</div>{% endif %}
</div>{% endfor %}
<div class="form-actions"><button type="submit">저장</button><a class="secondary" href="{% url 'todos:list' %}">취소</a></div>
</form>
{% endblock %}
